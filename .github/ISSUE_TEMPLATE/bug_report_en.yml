name: Bug report
description: v2rayA behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: AI may help you write this; unverified content may not be submitted.
  - type: input
    id: version
    attributes:
      label: v2rayA version
      description: Fixes go into the current release only. If you are not on the latest, say why you cannot upgrade.
      placeholder: "2.5.6"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: System and install method
      placeholder: "Debian 13, deb package / OpenWrt 24.10, feed / Docker on Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Transparent proxy mode
      options: [Off, tun, redirect, tproxy, System proxy]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Describe what you did, what you expected, and what happened. Name the browser for an interface problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Paste a few dozen lines around the failure, from `journalctl -u v2raya` or `docker logs v2raya`, from `/var/log/v2raya/v2raya.log`, or from the export on the Logs page."
      render: shell
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
  - type: input
    id: owner
    attributes:
      label: Human responsible for this report
      description: Enter your GitHub username to confirm that you verified the content and will answer the follow-up questions. An AI cannot answer for you.
      placeholder: "@your-name"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      description: Check every box that applies; a false claim closes the issue.
      options:
        - label: I searched the existing issues and pull requests; I found none reporting this.
          required: true
        - label: I checked the boxes above without reading them.
        - label: This report describes what I observed.
          required: true
        - label: I am an AI agent, and this content was submitted without human review.
