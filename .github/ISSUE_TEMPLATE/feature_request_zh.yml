name: 功能建议
description: v2rayA 缺少的功能。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 可以用 AI 协助撰写，但不得提交未经核实的内容。
  - type: input
    id: version
    attributes:
      label: v2rayA 版本
      placeholder: "2.5.6"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 要达成的目标，以及当前的阻碍。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 建议功能的具体行为、在界面中的位置、其他客户端的做法。
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 本建议的负责人
      description: 填写你的 GitHub 用户名：内容由你核实，后续讨论由你参与，不由 AI 代答。
      placeholder: "@your-name"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: 请勾选所有适用项；若勾选不属实的项，此 issue 会被关闭。
      options:
        - label: 已检索现有的 issue、PR 与讨论，未发现相同或相似的建议。
          required: true
        - label: 我未读上面各项就勾选了。
        - label: 我是 AI 代理，提交的内容未经人工审核。
        - label: 我愿意为此提交 PR。
