name: OpenWrt 24.10.4 VM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "service/**"
      - "docs/testing/openwrt-24.10.4-*"
      - ".github/workflows/openwrt-24.10.4.yml"

permissions:
  contents: read

jobs:
  group-strategies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            service/go.sum
            core/go.sum
      - name: Install QEMU and SSH client
        run: sudo apt-get update && sudo apt-get install --yes qemu-system-x86 openssh-client
      - name: Run strategy tests in OpenWrt 24.10.4
        shell: pwsh
        run: |
          ./docs/testing/openwrt-24.10.4-vm.ps1 `
            -Qemu (Get-Command qemu-system-x86_64).Source `
            -Go (Get-Command go).Source `
            -WorkDir "$env:RUNNER_TEMP/v2raya-openwrt-24.10.4"
      - name: Upload VM logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-24.10.4-vm-logs
          path: |
            ${{ runner.temp }}/v2raya-openwrt-24.10.4/serial.log
            ${{ runner.temp }}/v2raya-openwrt-24.10.4/qemu-error.log
