name: dispatch_copr

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - "gui/**"
      - ".github/workflows/*.yml"

jobs:
  call_copr:
    if: github.repository == 'v2rayA/v2rayA'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger COPR build
        env:
          COPR_HOOK_URL: ${{ secrets.COPR_HOOK_URL }}
        run: |
          if [ -z "$COPR_HOOK_URL" ]; then
            echo "::error::COPR_HOOK_URL is not configured"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --request POST "$COPR_HOOK_URL"
