name: Build & Release v2rayA
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: "The tag to release"
        required: true
jobs:
  Build_v2rayA_Web:
    uses: ./.github/workflows/_build_web.yml
    with:
      upload_archive: true

  Compute_Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.VERSION }}
    steps:
      - name: Compute Version
        id: prep
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT

  Build_v2rayA_Binaries:
    needs: [Build_v2rayA_Web, Compute_Version]
    uses: ./.github/workflows/_build_binaries.yml
    with:
      version: ${{ needs.Compute_Version.outputs.version }}

  Build_Windows_Installers:
    needs: [Build_v2rayA_Binaries, Compute_Version]
    uses: ./.github/workflows/_build_windows_installer.yml
    with:
      version: ${{ needs.Compute_Version.outputs.version }}

  Build_Linux_Packages:
    needs: [Build_v2rayA_Binaries, Compute_Version]
    uses: ./.github/workflows/_build_linux_packages.yml
    with:
      version: ${{ needs.Compute_Version.outputs.version }}

  GitHub_Release:
    runs-on: ubuntu-latest
    needs:
      [Build_v2rayA_Binaries, Build_Windows_Installers, Build_Linux_Packages]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        env:
          REF: ${{ inputs.tag }}
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: builds/
      - name: Move Files to Release Directory
        shell: bash
        run: |
          mkdir -p release
          for file in $(ls builds | grep -E "^installer|^v2raya"); do
            mv builds/$file/$file release/
          done
          mv builds/web.tar.gz/web.tar.gz release/
          for file in $(ls release); do
            sha256sum release/$file | awk '{print $1}' > release/$file.sha256.txt
          done
          ls -l release/
      - name: Compress Web Files
        shell: pwsh
        run: |
          Compress-Archive -Path ./builds/web/* -DestinationPath ./web.zip
          ((Get-FileHash ./web.zip).hash).ToLower() > web.zip.sha256.txt
          Move-Item ./web.zip ./release/web.zip
          Move-Item ./web.zip.sha256.txt ./release/web.zip.sha256.txt
      - name: Upload Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Latest_Releases=$(curl -s -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          Latest_tag=v${{ steps.prep.outputs.VERSION }}
          if [ "$Latest_Releases" != "$Latest_tag" ]; then
            gh release create "v${{ steps.prep.outputs.VERSION }}" -t "v${{ steps.prep.outputs.VERSION }}" --generate-notes
          fi
          gh release upload "v${{ steps.prep.outputs.VERSION }}" release/*
      # - name: Refresh Cloudflare Cache
      #   env:
      #     CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
      #     CF_PARGE_CACHE_AUTH_KEY: ${{ secrets.CF_PARGE_CACHE_AUTH_KEY }}
      #     CF_ZONE: ${{ secrets.CF_ZONE }}
      #   shell: bash
      #   run: |
      #     curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
      #       -H "X-Auth-Email: $CF_AUTH_EMAIL" \
      #       -H "Authorization: Bearer $CF_PARGE_CACHE_AUTH_KEY" \
      #       -H "Content-Type: application/json" \
      #       --data '{"purge_everything":true}'
  Release_to_Homebrew:
    runs-on: ubuntu-latest
    needs: [Build_v2rayA_Binaries]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        shell: bash
        env:
          REF: ${{ inputs.tag }}
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Download Artifact Linux x64
        uses: actions/download-artifact@v8
        with:
          name: v2raya_linux_x64_${{ steps.prep.outputs.VERSION }}
          path: Downloads
      - name: Download Core Artifact Linux x64
        uses: actions/download-artifact@v8
        with:
          name: v2raya_core_linux_x64_${{ steps.prep.outputs.VERSION }}
          path: Downloads
      - name: Download Artifact Linux arm64
        uses: actions/download-artifact@v8
        with:
          name: v2raya_linux_arm64_${{ steps.prep.outputs.VERSION }}
          path: Downloads
      - name: Download Core Artifact Linux arm64
        uses: actions/download-artifact@v8
        with:
          name: v2raya_core_linux_arm64_${{ steps.prep.outputs.VERSION }}
          path: Downloads
      - name: Download Artifact macOS x64
        uses: actions/download-artifact@v8
        with:
          name: v2raya_darwin_x64_${{ steps.prep.outputs.VERSION }}
          path: Downloads
      - name: Download Core Artifact macOS x64
        uses: actions/download-artifact@v8
        with:
          name: v2raya_core_darwin_x64_${{ steps.prep.outputs.VERSION }}
          path: Downloads
      - name: Download Artifact macOS arm64
        uses: actions/download-artifact@v8
        with:
          name: v2raya_darwin_arm64_${{ steps.prep.outputs.VERSION }}
          path: Downloads
      - name: Download Core Artifact macOS arm64
        uses: actions/download-artifact@v8
        with:
          name: v2raya_core_darwin_arm64_${{ steps.prep.outputs.VERSION }}
          path: Downloads
      - name: Compress to Zip Files
        run: |
          mkdir v2raya-x86_64-linux; cp Downloads/v2raya_linux_x64_${{ steps.prep.outputs.VERSION }} ./v2raya-x86_64-linux/v2raya
          cp Downloads/v2raya_core_linux_x64_${{ steps.prep.outputs.VERSION }} ./v2raya-x86_64-linux/v2raya_core
          mkdir v2raya-arm64-linux; cp Downloads/v2raya_linux_arm64_${{ steps.prep.outputs.VERSION }} ./v2raya-arm64-linux/v2raya
          cp Downloads/v2raya_core_linux_arm64_${{ steps.prep.outputs.VERSION }} ./v2raya-arm64-linux/v2raya_core
          mkdir v2raya-x86_64-macos; cp Downloads/v2raya_darwin_x64_${{ steps.prep.outputs.VERSION }} ./v2raya-x86_64-macos/v2raya
          cp Downloads/v2raya_core_darwin_x64_${{ steps.prep.outputs.VERSION }} ./v2raya-x86_64-macos/v2raya_core
          mkdir v2raya-aarch64-macos; cp Downloads/v2raya_darwin_arm64_${{ steps.prep.outputs.VERSION }} ./v2raya-aarch64-macos/v2raya
          cp Downloads/v2raya_core_darwin_arm64_${{ steps.prep.outputs.VERSION }} ./v2raya-aarch64-macos/v2raya_core
          zip -r9 v2raya-x86_64-linux.zip ./v2raya-x86_64-linux/*
          zip -r9 v2raya-arm64-linux.zip ./v2raya-arm64-linux/*
          zip -r9 v2raya-x86_64-macos.zip ./v2raya-x86_64-macos/*
          zip -r9 v2raya-aarch64-macos.zip ./v2raya-aarch64-macos/*
          for file in $(ls v2raya-*.zip); do
            sha256sum $file > $file.sha256.txt
          done
      - name: Upload to Homebrew Tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_V2RAYA_TOKEN }}
        run: |
          tag_version=$(echo $VERSION | sed 's/v//g')
          gh release create $tag_version --repo v2rayA/homebrew-v2raya \
            --title "Releases $VERSION" --generate-notes
          gh release upload $tag_version --repo v2rayA/homebrew-v2raya \
            v2raya-x86_64-linux.zip v2raya-x86_64-linux.zip.sha256.txt \
            v2raya-arm64-linux.zip v2raya-arm64-linux.zip.sha256.txt \
            v2raya-x86_64-macos.zip v2raya-x86_64-macos.zip.sha256.txt \
            v2raya-aarch64-macos.zip v2raya-aarch64-macos.zip.sha256.txt
  Release_v2rayA_to_Docker:
    runs-on: ubuntu-latest
    needs: [GitHub_Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
          IMAGE="mzz2017/v2raya"
          echo image=${IMAGE} >> $GITHUB_OUTPUT
          echo tag=${{ inputs.tag }} >> $GITHUB_OUTPUT
          sed -i "s|Realv2rayAVersion|$version|g" install/docker/docker_helper.sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Login to GitHub container registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Convert repository owner to lowercase
        run: |
          echo "LOWERCASE_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}
      - name: Build and push
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: install/docker/Dockerfile.Action
          platforms: linux/arm,linux/arm64,linux/amd64,linux/riscv64
          push: true
          tags: |
            ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.tag }}
            ${{ steps.prep.outputs.image }}:latest
            ghcr.io/${{ env.LOWERCASE_REPOSITORY_OWNER }}/v2raya:${{ steps.prep.outputs.tag }}
            ghcr.io/${{ env.LOWERCASE_REPOSITORY_OWNER }}/v2raya:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  Release_v2rayA_GUI_to_Docker:
    runs-on: ubuntu-latest
    needs: [Build_v2rayA_Web]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        env:
          REF: ${{ inputs.tag }}
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Download Web Files
        uses: actions/download-artifact@v8
        with:
          name: web
          path: web
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Login to GitHub container registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        uses: docker/login-action@v3.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Convert repository owner to lowercase
        run: |
          echo "LOWERCASE_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}
      - name: Build and push
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: install/docker/Dockerfile.GUI.Action
          platforms: linux/arm,linux/arm64,linux/amd64,linux/riscv64
          push: true
          tags: |
            mzz2017/v2raya-gui:latest
            ghcr.io/${{ env.LOWERCASE_REPOSITORY_OWNER }}/v2raya-gui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  Submit_to_Microsoft_winget:
    runs-on: windows-latest
    needs: [GitHub_Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        shell: bash
        env:
          REF: ${{ inputs.tag }}
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Submit to Microsoft winget
        shell: pwsh
        run: |
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $Installer_x64_url = "https://github.com/v2rayA/v2rayA/releases/download/v${{ steps.prep.outputs.VERSION }}/installer_windows_inno_x64_${{ steps.prep.outputs.VERSION }}.exe"
          $Installer_ARM64_url = "https://github.com/v2rayA/v2rayA/releases/download/v${{ steps.prep.outputs.VERSION }}/installer_windows_inno_arm64_${{ steps.prep.outputs.VERSION }}.exe"
          ./wingetcreate.exe update v2rayA.v2rayA --urls $Installer_x64_url $Installer_ARM64_url --version ${{ steps.prep.outputs.VERSION }} --token ${{ secrets.HOMEBREW_V2RAYA_TOKEN }} --submit
  Release_to_AUR:
    runs-on: ubuntu-latest
    needs: [GitHub_Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Version
        id: prep
        shell: bash
        env:
          REF: ${{ inputs.tag }}
        run: |
          tag=${{ inputs.tag }}
          version=$(echo $tag | sed 's/v//g')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          echo "VERSION=$version" >> $GITHUB_ENV
      - name: Clone & Update AUR Repository
        run: |
          mkdir -p aur
          git clone https://aur.archlinux.org/v2raya.git aur/v2raya
          git clone https://aur.archlinux.org/v2raya-bin.git aur/v2raya-bin
          cp install/aur/v2raya/.INSTALL aur/v2raya/.INSTALL
          cp install/aur/v2raya-bin/.INSTALL aur/v2raya-bin/.INSTALL
          cat install/aur/v2raya/PKGBUILD | sed "s|The_Real_Version|${{ steps.prep.outputs.VERSION }}|g" > aur/v2raya/PKGBUILD
          cat install/aur/v2raya-bin/PKGBUILD | sed "s|The_Real_Version|${{ steps.prep.outputs.VERSION }}|g" > aur/v2raya-bin/PKGBUILD
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Init Arch Linux Container
        run: |
          podman pull docker.io/archlinux:latest
          podman run -d --rm --name archContainer -v $PWD/aur:/aur docker.io/archlinux:latest sleep infinity
          podman exec --user root:root archContainer pacman -Syu base-devel pacman-contrib --noconfirm
          podman exec --user root:root archContainer chown -R $(id --user):$(id --user) /aur
      - name: Update HASH
        run: |
          podman exec --user $(id --user):$(id --user) archContainer bash -c "cd /aur/v2raya-bin && updpkgsums && makepkg --printsrcinfo > .SRCINFO"
          podman exec --user $(id --user):$(id --user) archContainer bash -c "cd /aur/v2raya && makepkg --printsrcinfo > .SRCINFO"
      - name: Import OpenSSH Key
        shell: bash
        run: |
          [ -d ~/.ssh ] || mkdir ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOL
          Host aur.archlinux.org
            HostName aur.archlinux.org
            IdentityFile ~/.ssh/id_ed25519
          EOL
      - name: Commit & Push to AUR
        run: |
          Current_Dir=$(pwd)
          sudo chown -R $(id -u):$(id -u) aur/v2raya
          sudo chown -R $(id -u):$(id -u) aur/v2raya-bin
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          cd $Current_Dir/aur/v2raya && git add .SRCINFO .INSTALL && \
            git commit -a -m "Update to v${{ steps.prep.outputs.VERSION }}" && \
            git push --force ssh://aur@aur.archlinux.org/v2raya.git
          cd $Current_Dir/aur/v2raya-bin && git add .SRCINFO .INSTALL && \
            git commit -a -m "Update to v${{ steps.prep.outputs.VERSION }}" && \
            git push --force ssh://aur@aur.archlinux.org/v2raya-bin.git
      - name: Clean Up
        run: |
          podman stop archContainer
